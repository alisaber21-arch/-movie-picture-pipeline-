name: Backend Continuous Integration

on:
  pull_request:
    branches: [main]
    paths: ['starter/backend/**', '.github/workflows/backend-ci.yaml']
  workflow_dispatch:

env:
  CFLAGS: -std=gnu17

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use mirror for base images (avoids public ECR rate limits)
        run: sed -i 's#public.ecr.aws/docker/library/#mirror.gcr.io/library/#' Dockerfile
      - name: Build Docker image
        run: docker build -t backend:${{ github.sha }} .
